<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cheong Khai Yun — Portfolio</title>
  <link rel="icon" type="image/png" href="icon.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:   '#1a1a1a',
            paper: '#f5f4f0',
            muted: '#9a9590',
            soft:  '#e2e0db',
            mid:   '#6b6762',
          },
          fontFamily: {
            display: ['"DM Serif Display"', 'serif'],
            mono:    ['"DM Mono"', 'monospace'],
            sans:    ['"DM Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { background:#f5f4f0; color:#1a1a1a; font-family:'DM Sans',sans-serif; font-weight:300; overflow-x:hidden; }
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-track { background:#f5f4f0; }
    ::-webkit-scrollbar-thumb { background:#1a1a1a; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .modal-enter { animation: fadeUp .25s ease; }

    /* Project carousel track */
    .proj-track {
      display: flex;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      will-change: transform;
    }
    .proj-slide {
      flex: 0 0 100%;
      width: 100%;
    }
    @media (min-width: 768px) {
      .proj-slide { flex: 0 0 50%; width: 50%; }
    }
    @media (min-width: 1024px) {
      .proj-slide { flex: 0 0 33.333%; width: 33.333%; }
    }

    /* Media carousel */
    .media-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .media-slide {
      flex: 0 0 100%;
      width: 100%;
    }

    /* drag cursor */
    .drag-area { cursor: grab; user-select: none; }
    .drag-area:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── DATA ─────────────────────────────────────────────────────── */
    const skills = [
      { cat: "Languages",         items: "C++  ·  Java  ·  C#  ·  Python  ·  PHP  ·  SQL" },
      { cat: "Web",               items: "HTML  ·  CSS  ·  JavaScript" },
      { cat: "Frameworks & DB",   items: "ASP.NET  ·  Flask  ·  MySQL  ·  PostgreSQL  ·  MSSQL" },
      { cat: "Tools & Design",    items: "GitHub  ·  VS Code  ·  Figma  ·  Canva  ·  MS Office" },
      { cat: "Languages Spoken",  items: "English (Fluent)  ·  Chinese (Fluent)  ·  Malay (Familiar)" },
      { cat: "Learning Focus",    items: "Web Development  ·  System Design  ·  Full Stack Dev  ·  Machine Learning" },
    ];

    // ─── PROJECTS ───────────────────────────────
    const projects = [
      {
        id: 1,
        title: "Document-Based Multimodal Chatbot",
        tags: ["Python", "Flask", "PostgreSQL", "AI/ML"],
        desc: "A web-based chatbot that understands both text and images in academic documents, with full session and citation tracking.",
        features: [
          "Integrated document analysis & image understanding APIs",
          "Relational DB schema for sessions, conversations, citation tracking",
          "Solo project — fully designed and developed independently",
        ],
        media: [{ type: "image", src: "assets/Project1/1.png" },
                { type: "image", src: "assets/Project1/2.png" },
                { type: "image", src: "assets/Project1/3.png" },
                { type: "image", src: "assets/Project1/4.png" }],
        demo: null,
        github: null,
      },
      {
        id: 2,
        title: "Multiuser E-Commerce — Agriculture",
        tags: ["PHP", "MySQL", "JavaScript", "CSS"],
        desc: "A team-built multiuser e-commerce platform for an agriculture business, with customer purchase flows and product reviews.",
        features: [
          "Designed customer purchase & product review workflow",
          "Led team coordination and managed GitHub repository",
          "Debugged and resolved technical issues during development",
        ],
        media: [{ type: "image", src: "assets/Project2/1.png" },
                { type: "image", src: "assets/Project2/2.png" },
                { type: "image", src: "assets/Project2/3.png" },
                { type: "image", src: "assets/Project2/4.png" },
                { type: "image", src: "assets/Project2/5.png" },
                { type: "image", src: "assets/Project2/6.png" },
                { type: "image", src: "assets/Project2/7.png" },
                { type: "image", src: "assets/Project2/8.png" },
                { type: "image", src: "assets/Project2/9.png" },
                { type: "image", src: "assets/Project2/10.png" }],
        demo: null,
        github: "https://github.com/Cloudie-yun/SmartMart",
      },
      {
        id: 3,
        title: "Full Stack Bakery E-Commerce",
        tags: ["ASP.NET", "C#", "MSSQL"],
        desc: "A complete e-commerce web app for a bakery, featuring a customer storefront and a full admin panel.",
        features: [
          "Customer & administrative modules",
          "Product management, shopping carts, order processing",
          "Capstone project — Diploma graduation",
        ],
        media: [{ type: "video", src: "assets/Project3/DemoVideo.mp4" }],
        demo: null,
        github: "https://github.com/Cloudie-yun/E-Commerce-Website-for-bakeries",
      },
      {
        id: 4,
        title: "TO-DO List Tracker",
        tags: ["PHP", "JavaScript", "CSS"],
        desc: "A simple and minimalist to-do list tracker that helps users manage tasks, projects and due dates.",
        features: [
          "Add and organize tasks easily",
          "Track project-related to-do items",
          "Set and monitor due dates"
        ],
        media: [{ type: "image", src: "assets/Project4/1.png" },
                { type: "image", src: "assets/Project4/2.png" },
                { type: "image", src: "assets/Project4/3.png" },
                { type: "image", src: "assets/Project4/4.png" }],
        demo: null,
        github: "https://github.com/Cloudie-yun/IndividualAssignment",
      },
    ];

    const education = [
      {
        school: "INTI International University",
        degree: "Bachelor of Computer Science (Hons) — Software Engineering",
        note: "Final Year Project: Document-Based Multimodal Chatbot",
        cgpa: "3.83",
        period: "Aug 2024 — Present",
        badge: "In Progress",
      },
      {
        school: "INTI International University",
        degree: "Diploma in Information Technology",
        note: "Capstone: Full Stack E-Commerce Website for Bakery Shop",
        cgpa: "3.79",
        period: "Aug 2022 — Jun 2024",
        badge: "Distinction",
      },
    ];

    /* ── ICONS ────────────────────────────────────────────────────── */
    const GH = ({ size = 15 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
    );

    const ChevronLeft = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    );

    const ChevronRight = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    );

    /* ── MEDIA SLIDE (image or video) ─────────────────────────────── */
    function MediaSlide({ item }) {
      if (!item) return null;
      if (item.type === 'video') {
        return (
          <video src={item.src} controls muted loop playsInline
                 className="w-full h-full object-cover" />
        );
      }
      return <img src={item.src} alt="" className="w-full h-full object-cover" />;
    }

    /* ── MEDIA CAROUSEL (inside modal) ───────────────────────────── */
    function MediaCarousel({ media }) {
      const [idx, setIdx] = useState(0);
      const total = media.length;

      // drag support
      const dragStart = useRef(null);
      const onPointerDown = e => { dragStart.current = e.clientX; };
      const onPointerUp   = e => {
        if (dragStart.current === null) return;
        const dx = e.clientX - dragStart.current;
        if (dx < -40 && idx < total - 1) setIdx(i => i + 1);
        if (dx >  40 && idx > 0)         setIdx(i => i - 1);
        dragStart.current = null;
      };

      if (total === 0) {
        return (
          <div className="w-full aspect-video bg-soft flex items-center justify-center">
            <p className="font-mono text-xs tracking-widest text-muted uppercase">[ Add demo screenshot or video ]</p>
          </div>
        );
      }

      return (
        <div className="relative w-full aspect-video bg-soft overflow-hidden select-none">
          {/* Track */}
          <div className="media-track h-full drag-area"
               style={{ transform: `translateX(-${idx * 100}%)` }}
               onPointerDown={onPointerDown}
               onPointerUp={onPointerUp}
               onPointerLeave={onPointerUp}>
            {media.map((item, i) => (
              <div key={i} className="media-slide h-full overflow-hidden">
                <MediaSlide item={item} />
              </div>
            ))}
          </div>

          {/* Prev / Next arrows */}
          {idx > 0 && (
            <button onClick={() => setIdx(i => i - 1)}
                    className="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-paper/80 hover:bg-paper text-ink transition-colors border-0 cursor-pointer">
              <ChevronLeft/>
            </button>
          )}
          {idx < total - 1 && (
            <button onClick={() => setIdx(i => i + 1)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-paper/80 hover:bg-paper text-ink transition-colors border-0 cursor-pointer">
              <ChevronRight/>
            </button>
          )}

          {/* Dot indicators */}
          {total > 1 && (
            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
              {media.map((_, i) => (
                <button key={i} onClick={() => setIdx(i)}
                        className={`w-1.5 h-1.5 rounded-full border-0 cursor-pointer transition-colors ${i === idx ? 'bg-ink' : 'bg-ink/30'}`}/>
              ))}
            </div>
          )}

          {/* Counter */}
          {total > 1 && (
            <p className="absolute top-3 right-3 font-mono text-xs text-ink/50 bg-paper/70 px-2 py-0.5">
              {idx + 1} / {total}
            </p>
          )}
        </div>
      );
    }

    /* ── PROJECT MODAL ────────────────────────────────────────────── */
    function ProjectModal({ project, onClose }) {
      useEffect(() => {
        const fn = e => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', fn);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', fn); document.body.style.overflow = ''; };
      }, []);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/75 backdrop-blur-sm"
             onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal-enter relative w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-paper">
            <button onClick={onClose}
                    className="absolute top-4 right-4 z-10 w-9 h-9 flex items-center justify-center text-sm bg-paper/90 hover:bg-ink hover:text-paper transition-colors border-0 cursor-pointer">
              ✕
            </button>

            {/* Media carousel */}
            <MediaCarousel media={project.media || []} />

            <div className="p-8">
              <div className="flex flex-wrap gap-2 mb-4">
                {project.tags.map(t => (
                  <span key={t} className="font-mono text-xs uppercase tracking-wide border border-soft text-muted px-2 py-0.5">{t}</span>
                ))}
              </div>
              <h3 className="font-display text-3xl tracking-tight mb-3">{project.title}</h3>
              <p className="text-base leading-relaxed text-mid mb-5">{project.desc}</p>
              <ul className="space-y-2 mb-6 list-none p-0">
                {project.features.map((f, i) => (
                  <li key={i} className="text-sm text-mid pl-5 relative before:content-['—'] before:absolute before:left-0 before:text-soft">
                    {f}
                  </li>
                ))}
              </ul>
              <div className="flex gap-3 flex-wrap pt-4 border-t border-soft">
                {project.github ? (
                  <a href={project.github} target="_blank" rel="noreferrer"
                     className="inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest border border-ink text-ink px-4 py-2.5 hover:bg-ink hover:text-paper transition-colors no-underline">
                    <GH size={13}/> Source Code
                  </a>
                ) : (
                  <span className="inline-flex items-center gap-2 font-mono text-xs uppercase tracking-widest border border-soft text-muted px-4 py-2.5">
                    <GH size={13}/> Source Code
                  </span>
                )}
                {project.demo && (
                  <a href={project.demo} target="_blank" rel="noreferrer"
                     className="font-mono text-xs uppercase tracking-widest text-ink border-b border-ink pb-px hover:text-mid transition-colors no-underline self-center">
                    Live Demo →
                  </a>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── PROJECT CARD THUMBNAIL ───────────────────────────────────── */
    function CardThumb({ media }) {
      const first = media?.[0];
      const count = media?.length || 0;
      if (!first) {
        return (
          <div className="w-full h-full flex items-center justify-center">
            <p className="font-mono text-xs tracking-widest text-muted uppercase">[ Click to expand ]</p>
          </div>
        );
      }
      return (
        <div className="relative w-full h-full">
          {first.type === 'video'
            ? <video src={first.src} muted loop playsInline className="w-full h-full object-cover"/>
            : <img src={first.src} alt="" className="w-full h-full object-cover"/>
          }
          {count > 1 && (
            <span className="absolute bottom-2 right-2 font-mono text-xs bg-paper/80 text-ink px-1.5 py-0.5">
              +{count - 1} more
            </span>
          )}
        </div>
      );
    }

    /* ── PROJECT CAROUSEL ─────────────────────────────────────────── */
    function Projects() {
      const [active, setActive] = useState(null);
      const [idx, setIdx]       = useState(0);
      const trackRef            = useRef(null);

      // Determine visible slides count based on window width
      const getVisible = () => {
        if (typeof window === 'undefined') return 1;
        if (window.innerWidth >= 1024) return 3;
        if (window.innerWidth >= 768)  return 2;
        return 1;
      };
      const [visible, setVisible] = useState(getVisible());

      useEffect(() => {
        const fn = () => setVisible(getVisible());
        window.addEventListener('resize', fn);
        return () => window.removeEventListener('resize', fn);
      }, []);

      const maxIdx = Math.max(0, projects.length - visible);
      const prev = () => setIdx(i => Math.max(0, i - 1));
      const next = () => setIdx(i => Math.min(maxIdx, i + 1));

      // Drag / swipe
      const dragStart = useRef(null);
      const onPointerDown = e => { dragStart.current = e.clientX; };
      const onPointerUp   = e => {
        if (dragStart.current === null) return;
        const dx = e.clientX - dragStart.current;
        if (dx < -40) next();
        if (dx >  40) prev();
        dragStart.current = null;
      };

      // percentage offset per slide
      const slideW = 100 / visible;

      return (
        <section id="projects" className="px-8 md:px-14 py-24 border-t border-soft">
          <div className="max-w-5xl mx-auto">

            {/* Header row */}
            <div className="flex items-end justify-between mb-10 flex-wrap gap-4">
              <div>
                <p className="font-mono text-xs uppercase tracking-widest text-muted mb-3">03 — Projects</p>
                <h2 className="font-display text-4xl md:text-5xl tracking-tight">Things I've Built</h2>
              </div>
              {/* Arrow controls */}
              <div className="flex gap-2 items-center">
                <span className="font-mono text-xs text-muted mr-2">{idx + 1} – {Math.min(idx + visible, projects.length)} / {projects.length}</span>
                <button onClick={prev} disabled={idx === 0}
                        className="w-10 h-10 flex items-center justify-center border border-soft text-mid hover:border-ink hover:text-ink disabled:opacity-30 disabled:cursor-not-allowed transition-colors bg-transparent cursor-pointer">
                  <ChevronLeft/>
                </button>
                <button onClick={next} disabled={idx >= maxIdx}
                        className="w-10 h-10 flex items-center justify-center border border-soft text-mid hover:border-ink hover:text-ink disabled:opacity-30 disabled:cursor-not-allowed transition-colors bg-transparent cursor-pointer">
                  <ChevronRight/>
                </button>
              </div>
            </div>

            {/* Carousel viewport */}
            <div className="overflow-hidden border border-soft" ref={trackRef}>
              <div className="proj-track drag-area"
                   style={{ transform: `translateX(-${idx * slideW}%)` }}
                   onPointerDown={onPointerDown}
                   onPointerUp={onPointerUp}
                   onPointerLeave={onPointerUp}>
                {projects.map(p => (
                  <div key={p.id} className="proj-slide border-r border-soft last:border-r-0 flex flex-col cursor-pointer bg-paper hover:-translate-y-1 hover:shadow-md transition-all duration-300"
                       onClick={() => setActive(p)}>
                    {/* Thumbnail */}
                    <div className="w-full aspect-video bg-soft overflow-hidden">
                      <CardThumb media={p.media}/>
                    </div>
                    {/* Body */}
                    <div className="p-6 flex flex-col flex-1">
                      <div className="flex flex-wrap gap-1.5 mb-3">
                        {p.tags.map(t => (
                          <span key={t} className="font-mono text-xs uppercase tracking-wide border border-soft text-muted px-2 py-0.5">{t}</span>
                        ))}
                      </div>
                      <h3 className="font-display text-xl tracking-tight mb-2">{p.title}</h3>
                      <p className="text-sm leading-relaxed text-mid flex-1 mb-4">{p.desc}</p>
                      <div className="flex items-center justify-between mt-auto">
                        <span className="font-mono text-xs uppercase tracking-widest border-b border-ink pb-px">
                          View Details →
                        </span>
                        {p.github && (
                          <a href={p.github} target="_blank" rel="noreferrer"
                             onClick={e => e.stopPropagation()}
                             title="View source on GitHub"
                             className="w-8 h-8 flex items-center justify-center border border-soft text-muted hover:bg-ink hover:text-paper hover:border-ink transition-colors no-underline">
                            <GH size={14}/>
                          </a>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Dot indicators */}
            {projects.length > visible && (
              <div className="flex gap-2 justify-center mt-6">
                {Array.from({ length: maxIdx + 1 }).map((_, i) => (
                  <button key={i} onClick={() => setIdx(i)}
                          className={`w-1.5 h-1.5 rounded-full border-0 cursor-pointer transition-colors ${i === idx ? 'bg-ink' : 'bg-ink/20'}`}/>
                ))}
              </div>
            )}
          </div>

          {active && <ProjectModal project={active} onClose={() => setActive(null)}/>}
        </section>
      );
    }

    /* ── NAV ──────────────────────────────────────────────────────── */
    function Nav() {
      const [open, setOpen] = useState(false);
      const links = ["About","Skills","Projects","Education","Contact"];
      return (
        <nav className="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-8 md:px-14 py-5 bg-paper/90 backdrop-blur border-b border-soft">
          <span className="font-display text-lg tracking-tight">Khai Yun</span>
          <ul className="hidden md:flex gap-10 list-none m-0 p-0">
            {links.map(s => (
              <li key={s}>
                <a href={`#${s.toLowerCase()}`}
                   className="font-mono text-xs uppercase tracking-widest text-mid hover:text-ink transition-colors no-underline">
                  {s}
                </a>
              </li>
            ))}
          </ul>
          <button className="md:hidden flex flex-col gap-1.5 p-1 bg-transparent border-0 cursor-pointer"
                  onClick={() => setOpen(o => !o)}>
            <span className={`block w-5 h-px bg-ink transition-all duration-300 ${open ? 'rotate-45 translate-y-[7px]' : ''}`}/>
            <span className={`block w-5 h-px bg-ink transition-all duration-300 ${open ? 'opacity-0' : ''}`}/>
            <span className={`block w-5 h-px bg-ink transition-all duration-300 ${open ? '-rotate-45 -translate-y-[7px]' : ''}`}/>
          </button>
          {open && (
            <ul className="md:hidden fixed inset-x-0 top-16 bottom-0 bg-paper flex flex-col gap-8 px-10 pt-12 list-none m-0 z-40">
              {links.map(s => (
                <li key={s}>
                  <a href={`#${s.toLowerCase()}`}
                     className="font-mono text-sm uppercase tracking-widest text-mid hover:text-ink no-underline"
                     onClick={() => setOpen(false)}>{s}</a>
                </li>
              ))}
            </ul>
          )}
        </nav>
      );
    }

    /* ── HERO ─────────────────────────────────────────────────────── */
    function Hero() {
      return (
        <section id="about" className="min-h-screen flex flex-col justify-center px-8 md:px-14 pt-28 pb-16 relative overflow-hidden">
          <div className="max-w-5xl mx-auto w-full">
            <p className="font-mono text-xs tracking-widest uppercase text-muted mb-8">
              01 — Available for Internship · Jun – Oct 2025 · Min 18 weeks
            </p>
            <h1 className="font-display leading-none tracking-tight mb-6" style={{fontSize:'clamp(3.5rem,9vw,7.5rem)'}}>
              Cheong<br/>
              <span className="text-muted italic">Khai Yun</span>
            </h1>
            <p className="text-base md:text-lg leading-relaxed text-mid max-w-lg mb-10">
              Computer Science student at INTI International University,
              majoring in Software Engineering. I enjoy building practical
              software — from full-stack web apps to AI-powered chatbot systems.
              I am currently seeking an internship during my final semester.
            </p>
            <div className="flex gap-6 flex-wrap">
