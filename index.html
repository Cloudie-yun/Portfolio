<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheong Khai Yun — Portfolio</title>
    <link rel="icon" type="image/png" href="icon.jpg" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              soft: 'var(--color-surface-soft)',
              paper: 'var(--color-surface)',
              ink: 'var(--color-text)',
              mid: 'var(--color-text-secondary)',

              text: 'var(--color-text)',
              secondary: 'var(--color-text-secondary)',
              muted: 'var(--color-text-muted)',

              border: 'var(--color-border)',
              'border-strong': 'var(--color-border-strong)',

              accent: 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              'accent-contrast': 'var(--color-accent-contrast)',

              'img-overlay': 'var(--color-image-overlay)',
              'image-overlay': 'var(--color-image-overlay)',

              'on-dark': 'var(--color-on-dark)',
              'on-dark-secondary': 'var(--color-on-dark-secondary)',
              'on-dark-accent': 'var(--color-on-dark-accent)',

              'contrast-bg': 'var(--color-dark-bg)',
              'contrast-text': 'var(--color-dark-text)',
              'contrast-secondary': 'var(--color-dark-text-secondary)',
              'contrast-muted': 'var(--color-dark-muted)',
              'contrast-border': 'var(--color-dark-border)',
            },

            fontFamily: {
              display: ['"DM Serif Display"', 'serif'],
              mono: ['"DM Mono"', 'monospace'],
              sans: ['"DM Sans"', 'sans-serif'],
            }
          }
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.jsx"></script>
  </body>
</html>
